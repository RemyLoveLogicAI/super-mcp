# ── Super-MCP Docker Compose ────────────────────────
# One-command deployment:
#   docker compose up -d
# ────────────────────────────────────────────────────

services:
  super-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: super-mcp
    restart: unless-stopped
    ports:
      - "9090:9090"          # Prometheus metrics
    volumes:
      - smcp-data:/app/data  # Persistent data
      - ./skills:/app/skills:ro  # Skills directory (read-only)
    env_file:
      - .env
    environment:
      - SMCP_ENV=production
      - SMCP_LOG_LEVEL=INFO
      - SMCP_LOG_FORMAT=json
    healthcheck:
      test: ["CMD", "python", "-c", "from src.kernel.kernel import Kernel; print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M

